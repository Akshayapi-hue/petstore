name: Build and Push PetStore Images

on:
  push:
    branches:
      - master
    paths:
      - "petstoreapp/**"
      - "petstorepetservice/**"
      - "petstoreproductservice/**"
      - "petstoreorderservice/**"
      - ".github/workflows/build-push-images.yml"

  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: akshayacr2026unique.azurecr.io

jobs:
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: petstoreapp
            context: ./petstoreapp

          - image: petstorepetservice
            context: ./petstorepetservice

          - image: petstoreproductservice
            context: ./petstoreproductservice

          - image: petstoreorderservice
            context: ./petstoreorderservice

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}